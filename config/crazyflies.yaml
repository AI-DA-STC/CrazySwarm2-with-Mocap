# named list of all robots
#
# CRAZYRADIO BANDWIDTH NOTE
# -------------------------
# Every enabled firmware_logging topic consumes Crazyradio uplink bandwidth, and
# mocap pose updates consume downlink bandwidth (see docs/MOCAP.md). On a shared
# 2 Mbit/s radio the budget is easily exceeded with several drones. Keep logging
# rates low: pose @ 10 Hz, status @ 1 Hz, custom estimator @ 5 Hz are enough for
# monitoring. Raise only what you actually need, and prefer one radio dongle per
# 1-2 drones. Symptoms of saturation: dropped packets, latency warnings from the
# server, and the supervisor triggering emergency landings.
fileversion: 3

robots:
  cf1:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E701
    initial_position: [0.0, 0.0, 0.0]
    type: cf21  # see robot_types

  cf2:
    enabled: false
    uri: radio://0/80/2M/E7E7E7E702
    initial_position: [0.0, 0.0, 0.0]
    type: cf21  # see robot_types

# Definition of the various robot types
robot_types:
  cf21:
    motion_capture:
      tracking: "vendor" # one of "vendor", "librigidbodytracker"
      marker: default_single_marker
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V

  cf21_mocap_deck:
    motion_capture:
      tracking: "vendor" # one of "vendor", "librigidbodytracker"
      marker: default_single_error
      dynamics: default
    big_quad: false
    battery:
      voltage_warning: 3.8  # V
      voltage_critical: 3.7 # V

# global settings for all robots
all:
  # firmware logging for all drones. Keep frequencies low to protect radio
  # bandwidth (see header note above).
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 10 # Hz
      status:
        frequency: 1 # Hz
    # Each custom topic below is streamed from the firmware and republished as a
    # ROS topic /<cf>/<name> of type crazyflie_interfaces/LogDataGeneric.
    # Uncomment a block to ENABLE it. `vars` are firmware log-variable names (see
    # `ros2 run crazyflie listLogVariables` for the full list on your firmware).
    # Keep frequencies low — every enabled block costs Crazyradio bandwidth.
    custom_topics:
      estimator:
        frequency: 5 # Hz  (lower than the firmware default of 50 to save bandwidth)
        vars:
          - stateEstimate.x
          - stateEstimate.y
          - stateEstimate.z
      # attitude:                 # -> /cf1/attitude
      #   frequency: 10
      #   vars:
      #     - stabilizer.roll
      #     - stabilizer.pitch
      #     - stabilizer.yaw
      # kalman:                   # -> /cf1/kalman
      #   frequency: 10
      #   vars:
      #     - kalman.stateX
      #     - kalman.stateY
      #     - kalman.stateZ
      # battery:                  # -> /cf1/battery
      #   frequency: 1
      #   vars:
      #     - pm.vbat
      #     - pm.state
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2 # 1: complementary, 2: kalman
      controller: 1 # 1: PID, 2: mellinger
    locSrv:
      extPosStdDev: 1e-3
      extQuatStdDev: 0.5e-1
    kalman:
      resetEstimation: 1
  reference_frame: "world"
  broadcasts:
    num_repeats: 15 # number of times broadcast commands are repeated
    delay_between_repeats_ms: 1 # delay in milliseconds between individual repeats
